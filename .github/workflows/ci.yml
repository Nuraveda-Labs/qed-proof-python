name: sdk-python CI

# Only meaningful once this package lives in its own public repo — GitHub reads workflows from the
# repo root, so this file is inert inside the qed-proof-sdk monorepo today.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --extra test --extra anchor pytest -q
      - name: Build package
        run: uv build

name: sdk-python release

# Only meaningful once this package lives in its own public repo — GitHub reads workflows from the
# repo root, so this file is inert inside the qed-proof-sdk monorepo today. On the public repo, a
# `v*` tag builds and publishes to PyPI via trusted publishing (no stored token).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Run tests
        run: uv run --extra test --extra anchor pytest -q
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC) — no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # pinned by commit SHA (tag v1.14.2, resolved via the GitHub API 2026-09-26)
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
